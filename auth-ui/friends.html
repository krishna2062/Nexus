<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Friends</title>
    <link rel="stylesheet" href="shared.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .friends-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .friend-card { background: var(--white); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
        .friend-banner { width: 100%; height: 200px; object-fit: cover; }
        .friend-info { padding: 15px; text-align: center; }
        .friend-info h4 { margin-bottom: 10px; font-size: 1.1rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <h1 class="logo"><img src="logo.jpg" alt="Nexus" style="height:35px; width:35px; vertical-align:middle; border-radius:8px; margin-right:10px;">nexus</h1>
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" placeholder="Search Nexus">
            </div>
        </div>
        <div class="nav-center">
            <a href="dashboard.html" class="nav-icon" title="Home"><i class="fa-solid fa-house"></i></a>
            <a href="friends.html" class="nav-icon active" title="Friends"><i class="fa-solid fa-users"></i></a>
            <a href="reels.html" class="nav-icon" title="Reels"><i class="fa-solid fa-video"></i></a>
            <a href="chat.html" class="nav-icon" title="Chat"><i class="fa-solid fa-message"></i></a>
        </div>
        <div class="nav-right">
            <a href="profile.html" class="profile-nav">
                <img src="" class="my-profile-pic" alt="Profile">
                <span class="my-profile-name">User</span>
            </a>
            <div class="nav-action-icon" id="logout-btn" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></div>
        </div>
    </nav>

    <div class="main-container">
        <aside class="left-sidebar">
            <a href="profile.html" class="sidebar-item">
                <img src="" class="my-profile-pic">
                <span class="my-profile-name">User</span>
            </a>
            <a href="friends.html" class="sidebar-item" style="background: var(--hover-bg);"><i class="fa-solid fa-user-group" style="color: #1877f2;"></i> Friends</a>
            <div class="sidebar-item"><i class="fa-solid fa-bookmark" style="color: #b026ff;"></i> Saved</div>
            <a href="reels.html" class="sidebar-item"><i class="fa-solid fa-play" style="color: #e42645;"></i> Reels</a>
        </aside>

        <main class="content-area" style="max-width: 900px;">
            <h2>People you may know</h2>
            <div class="friends-grid">
                <!-- Populated by JS -->
            </div>
        </main>
    </div>

    <script src="db.js"></script>
    <script src="main.js"></script>
</body>
</html>
