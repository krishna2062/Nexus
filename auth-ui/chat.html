<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Chat</title>
    <link rel="stylesheet" href="shared.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-layout { display: flex; height: calc(100vh - 104px); background: #111b21; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); color: #e9edef; }
        .chat-sidebar { width: 300px; border-right: 1px solid #222d34; padding: 0; overflow-y: auto; background: #111b21; }
        .chat-sidebar h2 { padding: 15px 20px; background: #202c33; border-bottom: 1px solid #222d34; margin: 0; font-size: 1.2rem; }
        .chat-user { display: flex; align-items: center; gap: 15px; padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #222d34; transition: 0.2s; }
        .chat-user:hover, .chat-user.active { background: #202c33; }
        .chat-user img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover;}
        .chat-user-info { flex: 1; overflow: hidden; }
        .chat-user-info h4 { font-size: 1rem; margin-bottom: 4px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; color: #e9edef; }
        .chat-user-info p { font-size: 0.85rem; color: #8696a0; margin: 0; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        
        .chat-window { flex: 1; display: flex; flex-direction: column; background: #0b141a; position: relative; }
        /* Optional: WhatsApp doodle background */
        .chat-window::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); opacity: 0.05; pointer-events: none; z-index: 0; }
        
        .chat-header { padding: 10px 20px; background: #202c33; display: flex; align-items: center; gap: 15px; z-index: 1; }
        .chat-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover;}
        .chat-header h4 { font-size: 1rem; color: #e9edef; margin: 0; }
        
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; z-index: 1; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; position: relative; line-height: 1.4; word-wrap: break-word; color: #e9edef; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .message.received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .message.sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        
        .msg-time { display: inline-block; font-size: 0.7rem; color: rgba(255,255,255,0.6); margin-left: 10px; float: right; margin-top: 5px; }
        
        .chat-input-area { padding: 12px 20px; background: #202c33; display: flex; gap: 15px; align-items: center; z-index: 1; }
        .chat-input-area input { flex: 1; background: #2a3942; border: none; color: #e9edef; padding: 12px 20px; border-radius: 24px; outline: none; font-size: 0.95rem; }
        .chat-input-area input::placeholder { color: #8696a0; }
        .chat-input-area button { width: 40px; height: 40px; border-radius: 50%; background: #00a884; border: none; font-size: 1.2rem; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .chat-input-area button:hover { background: #00bfa5; }
        
        .no-chat-selected { flex: 1; display: flex; justify-content: center; align-items: center; flex-direction: column; color: #8696a0; background: #222d34;}
        
        .mobile-back-btn { display: none; margin-right: 5px; font-size: 1.2rem; cursor: pointer; color: #e9edef; padding: 5px; }
        
        @media (max-width: 768px) {
            .chat-layout { height: calc(100vh - 60px); margin: 0; border-radius: 0; }
            .chat-sidebar { width: 100%; border-right: none; }
            
            /* If chat is active, hide sidebar and show window in full width */
            .chat-layout.chat-active-mobile .chat-sidebar { display: none; }
            .chat-layout.chat-active-mobile .chat-window { display: flex; width: 100%; height: 100%; }
            .chat-layout:not(.chat-active-mobile) .chat-window { display: none !important; }
            .chat-layout:not(.chat-active-mobile) .no-chat-selected { display: none !important; }
            
            .mobile-back-btn { display: block; }
            .chat-input-area { padding: 10px; gap: 10px; }
            .chat-messages { padding: 15px 10px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="dashboard.html" class="logo"><img src="logo.jpg" alt="Nexus" style="height:35px; width:35px; vertical-align:middle; border-radius:8px; margin-right:10px;">nexus<span style="color:var(--cyan)">.</span></a>
        </div>
        <div class="search-box">
            <input type="text" placeholder="Search accounts and videos">
            <i class="fa-solid fa-search" style="color: var(--text-secondary); cursor: pointer;"></i>
        </div>
        <div class="nav-right">
            <a href="upload.html" class="btn-upload"><i class="fa-solid fa-plus"></i> Upload</a>
            <a href="chat.html" class="nav-icon active" title="Chat"><i class="fa-regular fa-comment-dots"></i></a>
            <a href="inbox.html" class="nav-icon" title="Inbox"><i class="fa-regular fa-paper-plane"></i></a>
            <a href="profile.html" class="profile-nav">
                <img src="" class="my-profile-pic" alt="Profile">
            </a>
            <a href="#" class="nav-icon" title="Logout" onclick="DB.logout()" style="color:var(--text-secondary); margin-left:10px;"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
        </div>
    </nav>

    <div class="main-container" style="padding: 24px; justify-content: center; max-width: 1200px; margin: 60px auto 0;">
        <div class="chat-layout" style="width: 100%;">
            <div class="chat-sidebar">
                <h2>Messages</h2>
                <div class="chat-list" id="chat-friends-list">
                    <!-- JS Fills this -->
                </div>
            </div>
            
            <div class="no-chat-selected" id="no-chat-selected">
                <i class="fa-regular fa-paper-plane" style="font-size: 4rem; margin-bottom: 20px;"></i>
                <h3>Your Messages</h3>
                <p>Select a friend to start chatting.</p>
            </div>

            <div class="chat-window" id="chat-window" style="display:none;">
                <div class="chat-header">
                    <i class="fa-solid fa-arrow-left mobile-back-btn" onclick="window.history.back()"></i>
                    <img src="" id="chat-active-img">
                    <h4 id="chat-active-name">User Name</h4>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <!-- Messages go here -->
                </div>
                <div class="chat-input-area">
                    <input type="text" placeholder="Type a message..." id="chat-input-msg">
                    <button id="send-msg-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script src="main.js"></script>
</body>
</html>
