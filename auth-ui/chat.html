<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Chat</title>
    <link rel="stylesheet" href="shared.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-layout { display: flex; height: calc(100vh - 104px); background: #000000; border-radius: 8px; overflow: hidden; border: 1px solid #222; color: #fff; }
        .chat-sidebar { width: 300px; border-right: 1px solid #222; padding: 0; overflow-y: auto; background: #000000; }
        .chat-sidebar h2 { padding: 15px 20px; background: #000000; border-bottom: 1px solid #222; margin: 0; font-size: 1.2rem; }
        .chat-user { display: flex; align-items: center; gap: 15px; padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #1a1a1a; transition: 0.2s; }
        .chat-user:hover, .chat-user.active { background: #1a1a1a; }
        .chat-user img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover;}
        .chat-user-info { flex: 1; overflow: hidden; }
        .chat-user-info h4 { font-size: 1rem; margin-bottom: 4px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; color: #fff; }
        .chat-user-info p { font-size: 0.85rem; color: #888; margin: 0; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        
        .chat-window { flex: 1; display: flex; flex-direction: column; background: #000000; position: relative; }
        
        .chat-header { padding: 10px 20px; background: #000000; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 15px; z-index: 1; }
        .chat-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover;}
        .chat-header h4 { font-size: 1rem; color: #e9edef; margin: 0; }
        
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; z-index: 1; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; position: relative; line-height: 1.4; word-wrap: break-word; color: #fff; }
        .message.received { background: #1a1a1a; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #222; }
        .message.sent { background: #fe2c55; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .msg-time { display: block; font-size: 0.7rem; color: rgba(255,255,255,0.6); margin-top: 4px; text-align: right; }
        
        .chat-input-area { padding: 15px 20px; background: #000000; display: flex; gap: 10px; align-items: center; z-index: 1; border-top: 1px solid #222;}
        .chat-input-area input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px 20px; border-radius: 24px; outline: none; font-size: 0.95rem; }
        .chat-input-area input::placeholder { color: #888; }
        .chat-input-area button { width: 44px; height: 44px; border-radius: 50%; background: #fe2c55; border: none; font-size: 1.2rem; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .chat-input-area button:hover { opacity: 0.9; }
        
        .no-chat-selected { flex: 1; display: flex; justify-content: center; align-items: center; flex-direction: column; color: #888; background: #000000;}
        
        .mobile-back-btn { display: none; margin-right: 5px; font-size: 1.2rem; cursor: pointer; color: #fff; padding: 5px; }
        
        @media (max-width: 768px) {
            .chat-layout { height: calc(100vh - 60px); margin: 0; border-radius: 0; }
            .chat-sidebar { width: 100%; border-right: none; }
            
            /* If chat is active, hide sidebar and show window in full width */
            .chat-layout.chat-active-mobile .chat-sidebar { display: none; }
            .chat-layout.chat-active-mobile .chat-window { display: flex; width: 100%; height: 100%; }
            .chat-layout:not(.chat-active-mobile) .chat-window { display: none !important; }
            .chat-layout:not(.chat-active-mobile) .no-chat-selected { display: none !important; }
            
            .mobile-back-btn { display: block; }
            .chat-input-area { padding: 10px; gap: 10px; }
            .chat-messages { padding: 15px 10px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="dashboard.html" class="logo"><img src="logo.jpg" alt="Nexus" style="height:35px; width:35px; vertical-align:middle; border-radius:8px; margin-right:10px;">nexus<span style="color:var(--cyan)">.</span></a>
        </div>
        <div class="search-box" style="position:relative;">
            <input type="text" id="search-input" placeholder="Search accounts and videos" autocomplete="off">
            <i class="fa-solid fa-search" style="color: var(--text-secondary); cursor: pointer;"></i>
            <div id="search-results" style="display:none; position:absolute; top:45px; left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:8px; z-index:100; max-height:300px; overflow-y:auto; box-shadow:var(--shadow);"></div>
        </div>
        <div class="nav-right">
            <a href="upload.html" class="btn-upload"><i class="fa-solid fa-plus"></i> Upload</a>
            <a href="chat.html" class="nav-icon active" title="Chat"><i class="fa-regular fa-comment-dots"></i></a>
            <a href="inbox.html" class="nav-icon" title="Inbox"><i class="fa-regular fa-paper-plane"></i></a>
            <a href="profile.html" class="profile-nav">
                <img src="" class="my-profile-pic" alt="Profile">
            </a>
            <a href="#" class="nav-icon" title="Logout" onclick="DB.logout()" style="color:var(--text-secondary); margin-left:10px;"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
        </div>
    </nav>

    <div class="main-container" style="padding: 24px; justify-content: center; max-width: 1200px; margin: 60px auto 0;">
        <div class="chat-layout" style="width: 100%;">
            <div class="chat-sidebar">
                <h2>Messages</h2>
                <div class="chat-list" id="chat-friends-list">
                    <!-- JS Fills this -->
                </div>
            </div>
            
            <div class="no-chat-selected" id="no-chat-selected">
                <i class="fa-regular fa-paper-plane" style="font-size: 4rem; margin-bottom: 20px;"></i>
                <h3>Your Messages</h3>
                <p>Select a friend to start chatting.</p>
            </div>

            <div class="chat-window" id="chat-window" style="display:none;">
                <div class="chat-header">
                    <i class="fa-solid fa-arrow-left mobile-back-btn" onclick="window.history.back()"></i>
                    <img src="" id="chat-active-img">
                    <h4 id="chat-active-name">User Name</h4>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <!-- Messages go here -->
                </div>
                <div class="chat-input-area">
                    <input type="text" placeholder="Type a message..." id="chat-input-msg">
                    <button id="send-msg-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script src="main.js"></script>
    <!-- Mobile Search Modal -->
    <div id="mobile-search-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg-color); z-index:9999; flex-direction:column;">
        <div style="display:flex; align-items:center; padding:15px; border-bottom:1px solid var(--border); background:var(--surface);">
            <i class="fa-solid fa-arrow-left" style="font-size:1.2rem; margin-right:15px; cursor:pointer;" onclick="document.getElementById('mobile-search-modal').style.display='none'"></i>
            <input type="text" id="mobile-search-input" placeholder="Search users..." style="flex:1; background:var(--bg-color); border:none; color:white; padding:10px 15px; border-radius:20px; outline:none;" autocomplete="off">
        </div>
        <div id="mobile-search-results" style="flex:1; overflow-y:auto; padding:10px;">
            <p style="text-align:center; color:var(--text-secondary); margin-top:20px;">Type a username to search</p>
        </div>
    </div>
</body>
</html>
