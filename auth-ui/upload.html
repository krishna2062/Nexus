<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Upload</title>
    <link rel="stylesheet" href="shared.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="dashboard.html" class="logo"><img src="logo.jpg" alt="Nexus" style="height:35px; width:35px; vertical-align:middle; border-radius:8px; margin-right:10px;">nexus<span style="color:var(--cyan)">.</span></a>
        </div>
        <div class="search-box" style="position:relative;">
            <input type="text" id="search-input" placeholder="Search accounts and videos" autocomplete="off">
            <i class="fa-solid fa-search" style="color: var(--text-secondary); cursor: pointer;"></i>
            <div id="search-results" style="display:none; position:absolute; top:45px; left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:8px; z-index:100; max-height:300px; overflow-y:auto; box-shadow:var(--shadow);"></div>
        </div>
        <div class="nav-right">
            <a href="upload.html" class="btn-upload"><i class="fa-solid fa-plus"></i> Upload</a>
            <a href="chat.html" class="nav-icon" title="Chat"><i class="fa-regular fa-comment-dots"></i></a>
            <a href="inbox.html" class="nav-icon" title="Inbox"><i class="fa-regular fa-paper-plane"></i></a>
            <a href="profile.html" class="profile-nav">
                <img src="" class="my-profile-pic" alt="Profile">
            </a>
            <a href="#" class="nav-icon" title="Logout" onclick="DB.logout()" style="color:var(--text-secondary); margin-left:10px;"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
        </div>
    </nav>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-item" id="nav-foryou"><i class="fa-solid fa-house"></i> For You</a>
                <a href="dashboard.html?feed=following" class="sidebar-item" id="nav-following"><i class="fa-solid fa-user-group"></i> Following</a>
                <a href="upload.html" class="sidebar-item upload-bottom-nav" style="display:none;"><i class="fa-solid fa-plus" style="background:var(--primary); color:white; border-radius:10px; padding:5px 10px;"></i></a>
                <a href="profile.html" class="sidebar-item"><i class="fa-regular fa-user"></i> Profile</a>
                <a href="#" class="sidebar-item" onclick="document.getElementById('mobile-search-modal').style.display='flex'"><i class="fa-solid fa-search"></i> Search</a>
            </div>
            <div class="following-list">
                <h4>Following accounts</h4>
                <div id="following-list">
                    <!-- JS fills this -->
                </div>
            </div>
        </aside>

        <main class="content-area" style="display:block; overflow-y:auto; scroll-snap-type:none;">
            <div class="upload-container">
                <h2>Upload video</h2>
                <p style="color: var(--text-secondary); margin-bottom: 30px;">Post a video to your account</p>
                
                <form id="upload-form" class="upload-form">
                    <div class="form-group">
                        <label>Select Video from Device</label>
                        <div style="border: 2px dashed var(--border); padding: 40px; text-align: center; border-radius: 8px; margin-bottom: 10px; background: var(--bg-color);">
                            <i class="fa-solid fa-cloud-arrow-up" style="font-size: 3rem; color: var(--text-secondary); margin-bottom: 15px;"></i>
                            <p style="margin-bottom: 15px;">Select video to upload</p>
                            <input type="file" id="video-file" accept="video/mp4,video/webm" required style="width: 100%; border:none; background:transparent;">
                        </div>
                        <small style="color:var(--primary); font-weight:bold;">Important: Since this is a local demo, please upload a VERY small video (Under 2MB) otherwise it will crash the browser storage.</small>
                    </div>
                    <div class="form-group">
                        <label>Caption</label>
                        <textarea id="video-caption" rows="4" placeholder="Write a description or add hashtags..." required></textarea>
                    </div>
                    <div class="form-group" style="position: relative;">
                        <label>Mention a Friend (Optional)</label>
                        <input type="text" id="mention-input" placeholder="@search friend name">
                        <input type="hidden" id="mentioned-user-id">
                        <div id="mention-results" style="display:none; position:absolute; background:var(--surface); width:100%; max-height:150px; overflow-y:auto; border-radius:5px; z-index:10; border:1px solid var(--border);"></div>
                        <div id="selected-mention" style="color:var(--primary); font-weight:bold; margin-top:5px;"></div>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 15px;" id="upload-btn">Post</button>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script src="main.js"></script>
    <!-- Mobile Search Modal -->
    <div id="mobile-search-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg-color); z-index:9999; flex-direction:column;">
        <div style="display:flex; align-items:center; padding:15px; border-bottom:1px solid var(--border); background:var(--surface);">
            <i class="fa-solid fa-arrow-left" style="font-size:1.2rem; margin-right:15px; cursor:pointer;" onclick="document.getElementById('mobile-search-modal').style.display='none'"></i>
            <input type="text" id="mobile-search-input" placeholder="Search users..." style="flex:1; background:var(--bg-color); border:none; color:white; padding:10px 15px; border-radius:20px; outline:none;" autocomplete="off">
        </div>
        <div id="mobile-search-results" style="flex:1; overflow-y:auto; padding:10px;">
            <p style="text-align:center; color:var(--text-secondary); margin-top:20px;">Type a username to search</p>
        </div>
    </div>
</body>
</html>
